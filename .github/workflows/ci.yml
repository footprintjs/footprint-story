name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg   # the recorded-take tests cut with the real ffmpeg (they fail without it on CI)
        timeout-minutes: 10
      - run: npm test                                    # with the coverage thresholds
      - run: npx --yes -p typescript@5.9.3 tsc -p tsconfig.check.json   # the hand-kept types describe both doors
      - run: npx --yes publint@0.3.25 --strict
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only
